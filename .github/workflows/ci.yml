name: Agent CI Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEED_PACK: t02
  GEMINI_MODEL: gemini-3.0-flash
  GEMINI_IMAGE_MODEL: gemini-3.1-flash-image

jobs:
  test-and-validate-evals:
    name: Offline tests + golden eval schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make setup

      - name: Run offline unit tests
        run: make test

      - name: Validate golden evaluation cases
        run: make eval-validate PACK=t02

      - name: Publish CI Gate Summary
        if: always()
        run: |
          {
            echo "## ✅ Table 2 (\`t02_dynamic_storefronts\`) — Agent CI Gates"
            echo ""
            echo "| Gate | Command | Seed Pack | Models |"
            echo "|---|---|---|---|"
            echo "| Offline Unit & Guardrail Suite | \`make test\` | \`t02\` | \`${GEMINI_MODEL}\` |"
            echo "| Golden EvalSet & Tool Registry | \`make eval-validate PACK=t02\` | \`t02\` | \`${GEMINI_IMAGE_MODEL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
