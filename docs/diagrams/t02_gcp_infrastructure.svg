<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="T02 Dynamic Storefronts Google Cloud infrastructure diagram, showing build/deploy, serving/reasoning, and data/registry flows across GCP services">
  <title>T02 — Dynamic Storefronts · Google Cloud Infrastructure</title>
  <style>
    .edge{fill:none;stroke-width:2.2;opacity:.9}
    .flow{stroke-dasharray:7 8;animation:dash 1.1s linear infinite}
    .fall{stroke-width:1.6;stroke-dasharray:2 7;opacity:.55;animation:dash 1.9s linear infinite reverse}
    @keyframes dash{to{stroke-dashoffset:-150}}
    .title{font-size:14px;font-weight:700;fill:#e6edf3}
    .sub{font-size:10px;fill:#8b949e;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .hint{font-size:9.5px;fill:#6e7681;font-style:italic}
    .lane{font-size:14px;font-weight:700;fill:#8b949e;letter-spacing:.5px}
    .gatetitle{fill:#fca5a5}
    .standalone{stroke-dasharray:4 4}
  </style>
  <rect x="0" y="0" width="1600" height="1100" rx="14" fill="#0d1117"/>

  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#60a5fa"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2dd4bf"/></marker>
    <marker id="g3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#eab308"/></marker>
    <marker id="g4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a78bfa"/></marker>
  </defs>

  <text class="lane" x="40" y="35">① BUILD &amp; DEPLOY — GITHUB → CLOUD BUILD → ARTIFACT REGISTRY → RUNTIME</text>
  <text class="lane" x="40" y="300">② SERVE &amp; REASON — CLOUD RUN · AGENT RUNTIME · GEMINI</text>
  <text class="lane" x="40" y="615">③ DATA &amp; REGISTRY — BIGQUERY · CLOUD STORAGE · DISCOVERY · AGENT REGISTRY</text>

  <!-- Lane 1 edges -->
  <path class="edge flow" d="M170,110 L225,109" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M430,109 L495,109" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M700,98 C730,92 745,89 760,86" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M955,86 L1010,86" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M700,132 C730,145 745,155 760,169" stroke="#60a5fa" marker-end="url(#g1)"/>

  <!-- cross-lane: deploy + image pull -->
  <path class="edge flow" d="M857,204 C857,260 820,305 780,352" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M1050,122 C940,210 500,300 320,340" stroke="#60a5fa" marker-end="url(#g1)"/>
  <path class="edge flow" d="M595,148 C650,400 900,600 1100,645" stroke="#a78bfa" marker-end="url(#g4)"/>

  <!-- Lane 2 edges -->
  <path class="edge flow" d="M910,375 L975,398" stroke="#2dd4bf" marker-end="url(#g2)"/>
  <path class="edge flow" d="M490,372 C700,352 850,405 975,440" stroke="#2dd4bf" marker-end="url(#g2)"/>
  <path class="edge flow" d="M265,520 L265,545" stroke="#2dd4bf" marker-end="url(#g2)"/>

  <!-- cross-lane: agent runtime -> data/registry -->
  <path class="edge flow" d="M680,444 C600,540 400,610 290,645" stroke="#eab308" marker-end="url(#g3)"/>
  <path class="edge fall" d="M780,444 C730,530 660,590 600,645" stroke="#eab308" marker-end="url(#g3)"/>
  <path class="edge fall" d="M857,204 C857,400 750,550 650,645" stroke="#eab308" marker-end="url(#g3)"/>
  <path class="edge flow" d="M910,430 C912,520 913,580 915,645" stroke="#a78bfa" marker-end="url(#g4)"/>

  <!-- traveling dots -->
  <circle r="4.5" fill="#60a5fa"><animateMotion dur="3s" repeatCount="indefinite" path="M170,110 L225,109 M430,109 L495,109 M700,98 C730,92 745,89 760,86 M955,86 L1010,86"/></circle>
  <circle r="4.5" fill="#60a5fa"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite" path="M700,132 C730,145 745,155 760,169 M857,204 C857,260 820,305 780,352"/></circle>
  <circle r="4.5" fill="#60a5fa"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M1050,122 C940,210 500,300 320,340"/></circle>
  <circle r="4.5" fill="#a78bfa"><animateMotion dur="3.2s" repeatCount="indefinite" path="M595,148 C650,400 900,600 1100,645"/></circle>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="2.2s" repeatCount="indefinite" path="M910,375 L975,398"/></circle>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite" path="M490,372 C700,352 850,405 975,440"/></circle>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="1.8s" repeatCount="indefinite" path="M265,520 L265,545"/></circle>
  <circle r="4.5" fill="#eab308"><animateMotion dur="2.6s" repeatCount="indefinite" path="M680,444 C600,540 400,610 290,645"/></circle>
  <circle r="4.5" fill="#a78bfa"><animateMotion dur="2.4s" begin=".4s" repeatCount="indefinite" path="M910,430 C912,520 913,580 915,645"/></circle>

  <!-- ============ LANE 1 NODES ============ -->
  <g><rect x="40" y="86" width="130" height="48" rx="8" fill="#161b22" stroke="#30363d"/><rect x="40" y="86" width="4" height="48" fill="#60a5fa"/>
    <text class="title" x="105" y="108" text-anchor="middle">GitHub</text>
    <text class="sub" x="105" y="124" text-anchor="middle">push / PR</text></g>

  <g><rect x="225" y="74" width="205" height="74" rx="8" fill="#161b22" stroke="#30363d"/><rect x="225" y="74" width="4" height="74" fill="#60a5fa"/>
    <text class="title" x="327" y="96" text-anchor="middle">GitHub Actions CI</text>
    <text class="sub" x="327" y="112" text-anchor="middle">.github/workflows/ci.yml</text>
    <text class="sub" x="327" y="126" text-anchor="middle">make test + eval-validate</text>
    <text class="hint" x="327" y="140" text-anchor="middle">runs on every push / PR</text></g>

  <g><rect x="495" y="74" width="205" height="74" rx="8" fill="#161b22" stroke="#30363d"/><rect x="495" y="74" width="4" height="74" fill="#60a5fa"/>
    <text class="title" x="597" y="96" text-anchor="middle">GitHub Actions CD</text>
    <text class="sub" x="597" y="112" text-anchor="middle">cd-deploy-agent-runtime</text>
    <text class="sub" x="597" y="126" text-anchor="middle">same ci.yml, needs: CI</text>
    <text class="hint" x="597" y="140" text-anchor="middle">gated: push→main or dispatch</text></g>

  <g><rect x="760" y="58" width="195" height="64" rx="8" fill="#161b22" stroke="#30363d"/><rect x="760" y="58" width="4" height="64" fill="#60a5fa"/>
    <text class="title" x="857" y="78" text-anchor="middle" font-size="13">Cloud Build (image)</text>
    <text class="sub" x="857" y="94" text-anchor="middle">cd/cloudbuild-mcp-image.yaml</text>
    <text class="sub" x="857" y="108" text-anchor="middle">builds cd/Dockerfile.mcp</text></g>

  <g><rect x="1010" y="58" width="210" height="64" rx="8" fill="#161b22" stroke="#30363d"/><rect x="1010" y="58" width="4" height="64" fill="#60a5fa"/>
    <text class="title" x="1115" y="78" text-anchor="middle" font-size="13">Artifact Registry</text>
    <text class="sub" x="1115" y="94" text-anchor="middle">t02-mcp repo · europe-west1</text>
    <text class="sub" x="1115" y="108" text-anchor="middle">t02-mcp-server:latest</text></g>

  <g><rect x="760" y="140" width="195" height="64" rx="8" fill="#161b22" stroke="#30363d"/><rect x="760" y="140" width="4" height="64" fill="#60a5fa"/>
    <text class="title" x="857" y="160" text-anchor="middle" font-size="13">make deploy</text>
    <text class="sub" x="857" y="176" text-anchor="middle">deploy/deploy.py</text>
    <text class="sub" x="857" y="190" text-anchor="middle">→ Vertex AI Agent Runtime</text></g>

  <g><rect class="standalone" x="1010" y="140" width="210" height="64" rx="8" fill="#161b22" stroke="#6e7681"/>
    <text class="title" x="1115" y="160" text-anchor="middle" font-size="13">cloudbuild.yaml (root)</text>
    <text class="sub" x="1115" y="176" text-anchor="middle">pytest + eval + deploy.py</text>
    <text class="hint" x="1115" y="190" text-anchor="middle">standalone GCB trigger, not called by ci.yml</text></g>

  <!-- ============ LANE 2 NODES ============ -->
  <g><rect x="150" y="340" width="340" height="180" rx="8" fill="#161b22" stroke="#30363d"/><rect x="150" y="340" width="4" height="180" fill="#2dd4bf"/>
    <text class="title" x="320" y="364" text-anchor="middle">Cloud Run — t02-dynamic-storefronts-mcp</text>
    <text class="sub" x="320" y="382" text-anchor="middle">europe-west1</text>
    <text class="sub" x="320" y="398" text-anchor="middle">FastMCP SSE server + React UI (ui/dist)</text>
    <text class="sub" x="320" y="414" text-anchor="middle">/health · /.well-known/agent.json</text>
    <text class="sub" x="320" y="430" text-anchor="middle">/preview/&#123;segment&#125;</text>
    <text class="hint" x="320" y="448" text-anchor="middle">image pulled from Artifact Registry</text></g>

  <g><rect x="650" y="352" width="260" height="100" rx="8" fill="#161b22" stroke="#30363d"/><rect x="650" y="352" width="4" height="100" fill="#2dd4bf"/>
    <text class="title" x="780" y="376" text-anchor="middle" font-size="13">Vertex AI Agent Runtime</text>
    <text class="sub" x="780" y="394" text-anchor="middle">reasoningEngines · europe-west1</text>
    <text class="sub" x="780" y="408" text-anchor="middle">hosts deployed ADK root_agent</text></g>

  <g><rect x="975" y="338" width="280" height="140" rx="8" fill="#1c1410" stroke="#f87171" stroke-width="1.4"/>
    <text class="title gatetitle" x="1115" y="362" text-anchor="middle" font-size="13">Gemini — via Vertex AI</text>
    <text class="sub" x="1115" y="378" text-anchor="middle">⚠ GOOGLE_CLOUD_LOCATION=global</text>
    <text class="sub" x="1115" y="394" text-anchor="middle">GEMINI_MODEL (text reasoning)</text>
    <text class="sub" x="1115" y="408" text-anchor="middle">GEMINI_IMAGE_MODEL (hero image)</text>
    <text class="hint" x="1115" y="424" text-anchor="middle">everywhere else runs europe-west1</text></g>

  <g><rect x="150" y="545" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d"/><rect x="150" y="545" width="4" height="56" fill="#2dd4bf"/>
    <text class="title" x="265" y="567" text-anchor="middle" font-size="13">Browser / end users</text>
    <text class="sub" x="265" y="583" text-anchor="middle">React UI · SSE · agent card</text></g>

  <!-- ============ LANE 3 NODES ============ -->
  <g><rect x="150" y="645" width="280" height="130" rx="8" fill="#1c1410" stroke="#f87171" stroke-width="1.4"/>
    <text class="title gatetitle" x="290" y="669" text-anchor="middle" font-size="13">BigQuery — seed_t02</text>
    <text class="sub" x="290" y="685" text-anchor="middle">⚠ BQ_LOCATION=EU</text>
    <text class="sub" x="290" y="701" text-anchor="middle">audience_segments · products_catalog</text>
    <text class="sub" x="290" y="715" text-anchor="middle">storefront_experiments</text>
    <text class="hint" x="290" y="731" text-anchor="middle">read by BigQuery analytics tools</text></g>

  <g><rect x="470" y="645" width="260" height="130" rx="8" fill="#161b22" stroke="#30363d"/><rect x="470" y="645" width="4" height="130" fill="#eab308"/>
    <text class="title" x="600" y="669" text-anchor="middle" font-size="13">Cloud Storage</text>
    <text class="sub" x="600" y="685" text-anchor="middle">gs://&lt;project&gt;-hackathon-staging</text>
    <text class="sub" x="600" y="701" text-anchor="middle">.deployed_agent.json state sync</text>
    <text class="sub" x="600" y="715" text-anchor="middle">optional merchandising memory</text>
    <text class="hint" x="600" y="731" text-anchor="middle">T02_ENABLE_GCS_STATE=1</text></g>

  <g><rect x="770" y="645" width="290" height="130" rx="8" fill="#161b22" stroke="#30363d"/><rect x="770" y="645" width="4" height="130" fill="#a78bfa"/>
    <text class="title" x="915" y="669" text-anchor="middle" font-size="13">Discovery Engine / Gemini Enterprise</text>
    <text class="sub" x="915" y="685" text-anchor="middle">&#123;loc&#125;-discoveryengine.googleapis.com/v1alpha</text>
    <text class="sub" x="915" y="701" text-anchor="middle">register_gemini_enterprise_agent</text>
    <text class="hint" x="915" y="717" text-anchor="middle">one-time registration call → Reasoning Engine</text></g>

  <g><rect x="1100" y="645" width="290" height="130" rx="8" fill="#161b22" stroke="#30363d"/><rect x="1100" y="645" width="4" height="130" fill="#a78bfa"/>
    <text class="title" x="1245" y="669" text-anchor="middle" font-size="13">Agent Registry</text>
    <text class="sub" x="1245" y="685" text-anchor="middle">agentregistry.googleapis.com/v1alpha</text>
    <text class="sub" x="1245" y="701" text-anchor="middle">europe-west1 · final CD step</text>
    <text class="sub" x="1245" y="715" text-anchor="middle">registers Cloud Run MCP + Agent Runtime</text></g>

  <g font-size="12" fill="#8b949e">
    <line x1="40" y1="1020" x2="66" y2="1020" stroke="#60a5fa" stroke-width="3"/><text x="74" y="1025">build / deploy</text>
    <line x1="210" y1="1020" x2="236" y2="1020" stroke="#2dd4bf" stroke-width="3"/><text x="244" y="1025">serve / reason</text>
    <line x1="390" y1="1020" x2="416" y2="1020" stroke="#eab308" stroke-width="3"/><text x="424" y="1025">data read / state</text>
    <line x1="600" y1="1020" x2="626" y2="1020" stroke="#a78bfa" stroke-width="3"/><text x="634" y="1025">discovery / registry</text>
    <circle cx="820" cy="1020" r="5" fill="#f87171"/><text x="834" y="1025">region outlier (⚠)</text>
    <text x="40" y="1050" font-size="11" fill="#6e7681" font-style="italic">default region is europe-west1 everywhere except the two flagged boxes · dashed box = standalone / not wired into ci.yml</text>
  </g>
</svg>
