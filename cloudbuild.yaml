steps:
  - id: test-eval-deploy
    name: "ghcr.io/astral-sh/uv:python3.12-bookworm"
    entrypoint: "bash"
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
      - "GOOGLE_GENAI_USE_VERTEXAI=1"
      - "GOOGLE_CLOUD_LOCATION=global"
      - "GEMINI_MODEL=gemini-3.8-flash"
      - "GEMINI_IMAGE_MODEL=gemini-3.1-flash-image"
      - "AGENT_RUNTIME_LOCATION=europe-west1"
      - "BQ_LOCATION=EU"
      - "STAGING_BUCKET=gs://$PROJECT_ID-hackathon-staging"
      - "SEED_PACK=${_SEED_PACK}"
      - "AGENT_RUNTIME_DEPLOY=1"
    args:
      - "-c"
      - |
        set -euo pipefail
        uv venv --clear --python 3.12 .venv
        uv pip install --python .venv/bin/python -r pyproject.toml
        .venv/bin/python -m pytest -q
        .venv/bin/python -m eval.run_eval --pack "${_SEED_PACK}"
        # deploy.deploy handles sync_state_from_gcs and sync_state_to_gcs automatically
        .venv/bin/python -m deploy.deploy --pack "${_SEED_PACK}"
        .venv/bin/python -m deploy.test_remote

substitutions:
  _SEED_PACK: "t02"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
